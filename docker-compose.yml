version: "3.8"
services:
  ab-resolver:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"   # TEMP for testing; remove after HTTPS works
    # Pass through environment variables from the server shell or .env file.
    environment:
      - NODE_ENV
      - PORT
      - TRUST_PROXY
      - DATABASE_URL
      - DB_SSL
      - SESSION_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      - ADMIN_ALLOWED_EMAILS
      - ALLOWED_ORIGINS
    networks:
      - sharednet

networks:
  sharednet:
    external: true
